groups:
  - name: oenexa-exchange-alerts
    rules:
      - alert: ServiceDown
        expr: up{service=\"oenexa-exchange\"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: \"oenexa-exchange instance is down\"
          description: \"Pod for oenexa-exchange has been down for more than 1 minute.\"
      - alert: High5xxRate
        expr: rate(http_requests_total{service=\"oenexa-exchange\",status=~\"5..\"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: \"Elevated 5xx error rate on oenexa-exchange\"