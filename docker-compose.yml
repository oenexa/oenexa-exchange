# ==============================================================================
# OENEXA High-Performance Exchange Engine — Standalone Stack
# ==============================================================================

version: "3.8"

services:
  oenexa-exchange:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oenexa-exchange-standalone
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
